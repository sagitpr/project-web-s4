{% load static %}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Warungio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/pages/buyer/checkout/style.css' %}" />
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-panel"><img src="{% static 'images/Warungio L.png' %}" alt="Warungio" class="brand-logo" /><div><h1>Warungio</h1><p>Pembeli</p></div></div>
        <nav class="nav-menu">
          <a href="{% url 'page-buyer-dashboard' %}">Beranda</a>
          <a href="{% url 'page-buyer-cart' %}">Keranjang</a>
          <a href="{% url 'page-buyer-orders' %}">Pesanan</a>
          <a href="{% url 'page-buyer-profile' %}">Profil</a>
        </nav>
      </aside>
      <main class="content-area">
        <section class="page-header"><div><h1>Checkout</h1><p class="section-subtitle">Konfirmasi pesanan dan metode pembayaran.</p></div></section>
        <p style="color:var(--muted);text-align:center;padding:40px">Halaman checkout akan tersedia segera.</p>
      </main>
    </div>
    <script src="{% static 'js/device-detector.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>
  </body>
</html>
