{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Produk - Warungio Seller</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
</head>
<body style="background:var(--color-surface-secondary);">
<div style="display:flex; min-height:100vh;">
    <aside id="sellerSidebar" style="width:var(--sidebar-width); background:var(--color-surface); border-right:1px solid var(--color-border); position:fixed; top:0; left:0; bottom:0; z-index:90; display:flex; flex-direction:column; overflow-y:auto;">
        <div style="padding:24px 20px; border-bottom:1px solid var(--color-border-light);">
            <div style="display:flex; align-items:center; gap:12px;">
                <img src="{% static 'images/Warungio L.png' %}" alt="Warungio" style="height:32px; width:auto;">
                <div>
                    <div style="font-size:18px; font-weight:800;"><span style="color:var(--color-brand);">Warung</span><span style="color:var(--color-text-primary);">io</span></div>
                    <small style="font-size:11px; color:var(--color-text-tertiary);">Manajemen Produk</small>
                </div>
            </div>
        </div>
        <nav style="flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:2px;">
            <a href="{% url 'page-seller-dashboard' %}" style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); font-size:var(--text-sm); font-weight:600; color:var(--color-text-secondary);"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="{% url 'page-seller-products' %}" style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); font-size:var(--text-sm); font-weight:600; color:white; background:var(--color-brand);"><i class="fa-solid fa-box"></i> Produk</a>
            <a href="{% url 'page-seller-orders' %}" style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); font-size:var(--text-sm); font-weight:600; color:var(--color-text-secondary);"><i class="fa-solid fa-receipt"></i> Pesanan</a>
            <a href="{% url 'page-seller-keuangan' %}" style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); font-size:var(--text-sm); font-weight:600; color:var(--color-text-secondary);"><i class="fa-solid fa-wallet"></i> Keuangan</a>
            <a href="{% url 'page-seller-laporan' %}" style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); font-size:var(--text-sm); font-weight:600; color:var(--color-text-secondary);"><i class="fa-solid fa-chart-line"></i> Laporan</a>
            <div style="flex:1;"></div>
            <a href="{% url 'page-seller-pengaturan' %}" style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); font-size:var(--text-sm); font-weight:600; color:var(--color-text-secondary);"><i class="fa-solid fa-gear"></i> Pengaturan</a>
        </nav>
    </aside>
    <main style="flex:1; margin-left:var(--sidebar-width); padding:24px; min-width:0;">
        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-xl); padding:16px 24px; margin-bottom:24px;">
            <div>
                <h1 style="font-size:20px; font-weight:800; color:var(--color-text-primary); margin:0;">Produk Saya</h1>
                <p style="font-size:13px; color:var(--color-text-tertiary); margin:4px 0 0;">Kelola, tambah, dan edit produk toko Anda.</p>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuToggle" style="background:var(--color-gray-100);box-shadow:none;"><i class="fa-solid fa-bars"></i></button>
            <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> Tambah Produk</button>
        </div>
        <div class="card">
            <div class="card-header" style="flex-wrap:wrap; gap:12px;">
                <div style="display:flex; gap:10px;">
                    <div style="position:relative;">
                        <i class="fa-solid fa-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--color-text-tertiary); font-size:13px;"></i>
                        <input type="text" placeholder="Cari produk..." class="form-input" style="width:260px; min-height:38px; padding:8px 12px 8px 34px;">
                    </div>
                    <select class="form-select" style="width:auto; min-height:38px; padding:8px 12px;">
                        <option>Semua Kategori</option>
                        <option>Sayuran</option>
                        <option>Buah</option>
                        <option>Sembako</option>
                    </select>
                    <select class="form-select" style="width:auto; min-height:38px; padding:8px 12px;">
                        <option>Semua Status</option>
                        <option>Aktif</option>
                        <option>Stok Rendah</option>
                        <option>Nonaktif</option>
                    </select>
                </div>
            </div>
            <div class="card-body" style="padding:0;">
                <div class="table-wrap">
                    <table class="w-table">
                        <thead>
                            <tr>
                                <th>Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Terjual</th>
                                <th>Status</th>
                                <th style="text-align:right;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody"></tbody>
                    </table>
                </div>
                <div class="empty-state" id="products-empty-state">
                    <div class="empty-icon"><i class="fa-solid fa-box-open"></i></div>
                    <h3>Belum Ada Produk</h3>
                    <p>Tambahkan produk pertama Anda untuk mulai berjualan.</p>
                    <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> Tambah Produk</button>
                </div>
            </div>
        </div>
    </main>
</div>
<style>
@media (max-width:768px) {
    #sellerSidebar { transform:translateX(-100%); }
    #sellerSidebar.open { transform:translateX(0); }
    main { margin-left:0 !important; padding:16px !important; }
}
</style>
<script src="{% static 'js/device-detector.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/utils/toast.js' %}"></script>
<script src="{% static 'js/pages/seller/products/script.js' %}"></script>
</body>
</html>
