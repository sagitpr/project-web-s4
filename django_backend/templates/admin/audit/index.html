{% extends "admin/base.html" %}
{% load static %}
{% block title %}Audit Logs - Warungio Admin{% endblock %}
{% block page_title %}Audit Logs{% endblock %}

{% block content %}
<div class="stats-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;">
    <div class="stat-card"><div class="stat-icon" style="background:#dcfce7;color:#16a34a;"><i class="fa-solid fa-clipboard-list"></i></div><div class="stat-content"><div class="stat-label">Errors (24h)</div><div class="stat-value" id="auditErrors24h"><span class="skeleton" style="display:inline-block;width:30px;height:24px;"></span></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#dbeafe;color:#2563eb;"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="stat-content"><div class="stat-label">Critical</div><div class="stat-value" id="auditCritical" style="color:#dc2626;"><span class="skeleton" style="display:inline-block;width:30px;height:24px;"></span></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;color:#d97706;"><i class="fa-solid fa-check-circle"></i></div><div class="stat-content"><div class="stat-label">Active Tasks</div><div class="stat-value" id="auditTasks"><span class="skeleton" style="display:inline-block;width:30px;height:24px;"></span></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fce7f3;color:#db2777;"><i class="fa-solid fa-database"></i></div><div class="stat-content"><div class="stat-label">DB Status</div><div class="stat-value" id="auditDb" style="font-size:14px;"><span class="skeleton" style="display:inline-block;width:60px;height:24px;"></span></div></div></div>
</div>

<div class="card">
    <div class="card-header"><h3>Recent Errors & Activity</h3></div>
    <div class="card-body" style="padding:0;">
        <div id="auditErrorList">
            <p style="font-size:13px;color:var(--color-text-tertiary);text-align:center;padding:40px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function() {
    async function loadData() {
        try {
            const token = (window.WarungioAuth && window.WarungioAuth.getAccessToken) 
              ? window.WarungioAuth.getAccessToken() 
              : localStorage.getItem('warungio_access_token');
            const headers = {};
            if (token) headers['Authorization'] = 'Bearer ' + token;

            const [dashRes, errorsRes] = await Promise.all([
                fetch('/api/monitoring/dashboard/', { headers, credentials: 'include' }),
                fetch('/api/monitoring/errors/?hours=24', { headers, credentials: 'include' })
            ]);

            if (dashRes.ok) {
                const d = await dashRes.json();
                document.getElementById('auditErrors24h').textContent = d.errors?.total_24h || 0;
                document.getElementById('auditCritical').textContent = d.errors?.critical || 0;
                document.getElementById('auditTasks').textContent = d.overview?.active_tasks || 0;
                document.getElementById('auditDb').textContent = d.overview?.db_connections ? d.overview.db_connections + ' conn' : 'Connected';
            }

            if (errorsRes.ok) {
                const errors = await errorsRes.json();
                const el = document.getElementById('auditErrorList');
                if (errors.length === 0) {
                    el.innerHTML = '<p style="font-size:13px;color:var(--color-text-tertiary);text-align:center;padding:40px;">Tidak ada error dalam 24 jam terakhir.</p>';
                } else {
                    el.innerHTML = errors.map(e => 
                        '<div style="padding:14px 20px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:flex-start;gap:12px;">' +
                        '<div style="width:36px;height:36px;border-radius:50%;background:' + (e.severity==='critical'?'#fce7f3':e.severity==='error'?'#fef3c7':'#dbeafe') + ';display:flex;align-items:center;justify-content:center;color:' + (e.severity==='critical'?'#db2777':e.severity==='error'?'#d97706':'#2563eb') + ';flex-shrink:0;"><i class="fa-solid fa-' + (e.severity==='critical'?'bolt':e.severity==='error'?'exclamation':'info') + '"></i></div>' +
                        '<div style="flex:1;"><p style="font-size:13px;font-weight:600;margin:0;">' + (e.service || 'System') + '</p><p style="font-size:12px;color:var(--color-text-secondary);margin:2px 0 0;">' + (e.message || '').substring(0,150) + '</p></div>' +
                        '<div style="text-align:right;flex-shrink:0;"><p style="font-size:11px;color:var(--color-text-tertiary);margin:0;">' + new Date(e.created_at).toLocaleString('id-ID') + '</p></div></div>'
                    ).join('');
                }
            }
        } catch (e) {
            document.getElementById('auditErrorList').innerHTML = '<p style="font-size:13px;color:#dc2626;text-align:center;padding:40px;">Gagal memuat data audit.</p>';
        }
    }
    loadData();
});
</script>
{% endblock %}
