{% extends "admin/base.html" %}{% load static %}
{% block title %}Detail Administrator - Warungio Admin{% endblock %}
{% block page_title %}Detail Administrator{% endblock %}
{% block extra_styles %}
<style>
.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.profile-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--color-gray-100);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:var(--color-brand);flex-shrink:0}
.profile-avatar img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.profile-info h2{font-size:22px;font-weight:800;margin:0 0 4px}
.profile-info .email{font-size:14px;color:var(--color-text-tertiary)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info-item{padding:16px;background:var(--color-gray-50);border-radius:12px}
.info-item .label{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:4px;letter-spacing:.04em}
.info-item .value{font-size:15px;font-weight:600;color:var(--color-text-primary)}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-yellow{background:#fef3c7;color:#d97706}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-blue{background:#dbeafe;color:#2563eb}
.activity-log{max-height:400px;overflow-y:auto}
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-border)}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.activity-detail .action{font-size:13px;font-weight:600;color:var(--color-text-primary)}
.activity-detail .desc{font-size:12px;color:var(--color-text-tertiary);margin-top:2px}
.activity-detail .time{font-size:11px;color:var(--color-text-disabled);margin-top:2px}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
@media(max-width:640px){.info-grid{grid-template-columns:1fr}}
</style>
{% endblock %}
{% block content %}
<a href="{% url 'admin-administrators' %}" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-primary);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:20px;transition:all .15s">
    <i class="fa-solid fa-arrow-left"></i> Kembali
</a>

<div id="detailContent">
    <div style="text-align:center;padding:60px"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--color-text-tertiary)"></i><p style="margin-top:12px;color:var(--color-text-tertiary)">Memuat data...</p></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function(){
    const pk = window.location.pathname.split('/').filter(Boolean).slice(-2,-1)[0];
    try{
        const token=localStorage.getItem('warungio_access_token');
        const res=await fetch(`/admin-panel/api/administrators/${pk}/`,{
            headers:token?{Authorization:'Bearer '+token}:{},credentials:'include'
        });
        const d=await res.json();
        if(!d.success) throw new Error(d.message);
        renderDetail(d, pk);
    }catch(e){
        document.getElementById('detailContent').innerHTML=`<div class="card" style="padding:40px;text-align:center"><i class="fa-solid fa-triangle-exclamation fa-2x" style="color:var(--color-danger)"></i><h3 style="margin-top:12px">Gagal Memuat Data</h3><p>${e.message}</p></div>`;
    }
});

function getInitials(name){if(!name)return 'A';return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}

function renderDetail(d, pk){
    const a=d.admin||d;
    const statusClass=!a.is_active?'badge-red':!a.is_verified?'badge-yellow':'badge-green';
    const statusText=!a.is_active?'Nonaktif':!a.is_verified?'Pending':'Aktif';
    const avatarHtml=a.profile_photo?`<img src="${a.profile_photo}" alt="">`:`${getInitials(a.full_name)}`;
    const logs=(d.recent_activity||[]).map(l=>{
        const colors={login:'#dbeafe',logout:'#f1f5f9',create_admin:'#dcfce7',delete_admin:'#fee2e2',activate_admin:'#dcfce7',deactivate_admin:'#fee2e2',change_password:'#fef3c7',verify_admin:'#dcfce7'};
        const icons={login:'fa-right-to-bracket',logout:'fa-right-from-bracket',create_admin:'fa-user-plus',delete_admin:'fa-trash',activate_admin:'fa-check',deactivate_admin:'fa-ban',change_password:'fa-key',verify_admin:'fa-shield-halved'};
        const icon=icons[l.action]||'fa-circle';
        const bg=colors[l.action]||'#f1f5f9';
        return `<div class="activity-item"><div class="activity-icon" style="background:${bg}"><i class="fa-solid ${icon}" style="color:var(--color-text-secondary)"></i></div><div class="activity-detail"><div class="action">${l.action_display||l.action}</div><div class="desc">${l.description||''}</div><div class="time">${l.created_at?new Date(l.created_at).toLocaleString('id-ID'):''}</div></div></div>`;
    }).join('')||'<p style="text-align:center;padding:20px;color:var(--color-text-tertiary)">Belum ada aktivitas</p>';

    document.getElementById('detailContent').innerHTML=`
    <div class="action-bar">
        <a href="/admin-panel/administrators/${pk}/edit/" class="btn-sm" style="padding:8px 16px"><i class="fa-solid fa-pen"></i> Edit</a>
        ${!a.is_active?`<button class="btn-sm" style="padding:8px 16px;background:#dcfce7;color:#16a34a;border-color:#bbf7d0" onclick="toggleStatus(${pk})"><i class="fa-solid fa-check"></i> Aktifkan</button>`
        :`<button class="btn-sm danger" style="padding:8px 16px" onclick="toggleStatus(${pk})"><i class="fa-solid fa-ban"></i> Nonaktifkan</button>`}
        ${a.is_active?`<button class="btn-sm danger" style="padding:8px 16px" onclick="if(confirm('Yakin ingin menghapus administrator ini?'))deleteAdmin(${pk})"><i class="fa-solid fa-trash"></i> Hapus</button>`:''}
    </div>

    <div class="card"><div class="card-body">
        <div class="profile-header">
            <div class="profile-avatar">${avatarHtml}</div>
            <div class="profile-info"><h2>${a.full_name||a.username||'N/A'}</h2><div class="email">${a.email}</div></div>
            <div><span class="badge ${statusClass}">${statusText}</span>
            <span class="badge ${a.is_superuser?'badge-yellow':'badge-blue'}" style="margin-left:6px">${a.role_display||(a.is_superuser?'Super Admin':'Admin')}</span></div>
        </div>
        <div class="info-grid">
            <div class="info-item"><div class="label">Username</div><div class="value">${a.username||'—'}</div></div>
            <div class="info-item"><div class="label">Email</div><div class="value">${a.email}</div></div>
            <div class="info-item"><div class="label">Role</div><div class="value">${a.role_display||(a.is_superuser?'Super Admin':'Admin')}</div></div>
            <div class="info-item"><div class="label">Status</div><div class="value">${statusText}</div></div>
            <div class="info-item"><div class="label">Terakhir Login</div><div class="value">${a.last_login?new Date(a.last_login).toLocaleString('id-ID'):'Belum pernah login'}</div></div>
            <div class="info-item"><div class="label">Bergabung</div><div class="value">${a.date_joined_display||(a.date_joined?new Date(a.date_joined).toLocaleString('id-ID'):'—')}</div></div>
            <div class="info-item"><div class="label">Nomor HP</div><div class="value">${a.phone||'—'}</div></div>
            <div class="info-item"><div class="label">Last IP</div><div class="value">${a.last_login_ip||'—'}</div></div>
        </div>
    </div></div>

    <div class="card" style="margin-top:20px">
        <div class="card-header"><h3 style="margin:0;font-size:15px"><i class="fa-solid fa-clock-rotate-left"></i> Aktivitas Terkini</h3></div>
        <div class="card-body activity-log">${logs}</div>
    </div>`;
}

async function toggleStatus(pk){
    if(!confirm('Yakin ingin mengubah status administrator ini?'))return;
    try{
        const token=localStorage.getItem('warungio_access_token');
        const res=await fetch(`/admin-panel/api/administrators/${pk}/toggle-status/`,{
            method:'POST',headers:token?{Authorization:'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'},credentials:'include'
        });
        const d=await res.json();
        if(d.success){location.reload()}else{alert(d.message)}
    }catch(e){alert('Gagal mengubah status')}
}

async function deleteAdmin(pk){
    try{
        const token=localStorage.getItem('warungio_access_token');
        const res=await fetch(`/admin-panel/api/administrators/${pk}/delete/`,{
            method:'DELETE',headers:token?{Authorization:'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'},credentials:'include'
        });
        const d=await res.json();
        if(d.success){window.location.href='/admin-panel/administrators/'}else{alert(d.message)}
    }catch(e){alert('Gagal menghapus')}
}
</script>
{% endblock %}
