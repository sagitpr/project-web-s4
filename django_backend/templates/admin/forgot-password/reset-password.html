<html lang="id">
<head>

    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
        body { font-family: var(--font-sans); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--color-text-primary); overflow-x: hidden; padding: 20px; position: relative; background: linear-gradient(160deg, #ffffff 0%, #f0fdf4 30%, #e8f5e9 60%, #f0fdf4 100%); }
        @media (prefers-color-scheme: dark) { body { background: linear-gradient(160deg, #0a0f0b 0%, #0d1a10 30%, #0f1f12 60%, #0a0f0b 100%); color: var(--color-text-inverse); } }
        .bg-pattern { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-pattern::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 25%, rgba(22,163,74,0.06) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(22,163,74,0.04) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(22,163,74,0.03) 0%, transparent 60%); }
        .bg-pattern::after { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(22,163,74,0.015) 40px, rgba(22,163,74,0.015) 41px), repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(22,163,74,0.015) 40px, rgba(22,163,74,0.015) 41px); }
        .bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); opacity: 0.35; }
        .bg-orb--1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(22,163,74,0.12) 0%, transparent 70%); top: -150px; right: -100px; animation: orbFloat 20s ease-in-out infinite alternate; }
        .bg-orb--2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%); bottom: -100px; left: -80px; animation: orbFloat 25s ease-in-out infinite alternate-reverse; }
        .bg-orb--3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(22,163,74,0.06) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); animation: orbFloat 18s ease-in-out infinite alternate; }
        @keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-20px) scale(1.05); } 66% { transform: translate(-20px,30px) scale(0.95); } 100% { transform: translate(15px,-10px) scale(1.02); } }
        @media (prefers-color-scheme: dark) { .bg-pattern::before { background-image: radial-gradient(circle at 15% 25%, rgba(22,163,74,0.10) 0%, transparent 50%), radial-gradient(circle at 85% 75%, rgba(22,163,74,0.07) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(22,163,74,0.05) 0%, transparent 60%); } .bg-pattern::after { opacity: 0.3; } .bg-orb--1 { background: radial-gradient(circle, rgba(22,163,74,0.20) 0%, transparent 70%); } .bg-orb--2 { background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%); } .bg-orb--3 { background: radial-gradient(circle, rgba(22,163,74,0.12) 0%, transparent 70%); } }
        .login-wrapper { position: relative; z-index: 2; width: 100%; max-width: 440px; margin: auto; padding: 20px 0; }
        .login-card-outer { position: relative; padding: 2px; border-radius: 24px; background: linear-gradient(135deg, rgba(22,163,74,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(22,163,74,0.10) 100%); box-shadow: 0 0 0 1px rgba(22,163,74,0.06), 0 20px 60px -12px rgba(0,0,0,0.12), 0 8px 24px -6px rgba(0,0,0,0.06); transition: box-shadow 0.3s var(--ease-smooth); }
        .login-card-outer:hover { box-shadow: 0 0 0 1px rgba(22,163,74,0.10), 0 24px 72px -12px rgba(0,0,0,0.16), 0 8px 28px -6px rgba(0,0,0,0.08); }
        @media (prefers-color-scheme: dark) { .login-card-outer { background: linear-gradient(135deg, rgba(22,163,74,0.25) 0%, rgba(255,255,255,0.03) 50%, rgba(22,163,74,0.18) 100%); box-shadow: 0 0 0 1px rgba(22,163,74,0.10), 0 20px 60px -12px rgba(0,0,0,0.35), 0 8px 24px -6px rgba(0,0,0,0.20); } .login-card-outer:hover { box-shadow: 0 0 0 1px rgba(22,163,74,0.18), 0 24px 72px -12px rgba(0,0,0,0.40), 0 8px 28px -6px rgba(0,0,0,0.25); } }
        .login-card { position: relative; border-radius: 22px; padding: 44px 36px 36px; background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, var(--color-brand), #4ade80, var(--color-brand), transparent); opacity: 0.6; }
        @media (prefers-color-scheme: dark) { .login-card { background: rgba(15,23,42,0.90); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); } }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-logo { width: 56px; height: 56px; object-fit: contain; margin-bottom: 16px; filter: drop-shadow(0 2px 8px rgba(22,163,74,0.15)); transition: transform 0.3s var(--ease-spring); }
        .login-logo:hover { transform: scale(1.04); }
        .login-title { font-size: 1.5rem; font-weight: 800; letter-spacing: var(--tracking-tight); color: var(--color-text-primary); line-height: 1.3; margin-bottom: 4px; }
        .login-title .brand-highlight { color: var(--color-brand); }

        @media (prefers-color-scheme: dark) { .login-title { color: #f1f5f9; } .login-logo { filter: drop-shadow(0 2px 12px rgba(22,163,74,0.25)); } }

        @media (prefers-color-scheme: dark) { .security-badge { color: var(--color-brand-light); background: rgba(22,163,74,0.12); border-color: rgba(22,163,74,0.18); } }
        .error-alert { display: none; align-items: flex-start; gap: 10px; padding: 14px 16px; margin-bottom: 24px; border-radius: var(--radius-lg); font-size: 0.8125rem; line-height: 1.5; color: #991b1b; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.15); }

        @media (prefers-color-scheme: dark) { .error-alert { color: #fca5a5; background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.18); } }
        .login-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 0.8125rem; font-weight: 600; color: var(--color-text-secondary); letter-spacing: 0.01em; }
        @media (prefers-color-scheme: dark) { .form-label { color: #cbd5e1; } }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-tertiary); pointer-events: none; transition: color 0.2s var(--ease-out); display: flex; align-items: center; justify-content: center; }
        .form-input { width: 100%; padding: 13px 14px 13px 44px; border: 1.5px solid var(--color-border); border-radius: var(--radius-xl, 16px); font-family: inherit; font-size: 0.9375rem; font-weight: 500; color: var(--color-text-primary); background: rgba(255,255,255,0.9); outline: none; transition: all 0.2s var(--ease-out); -webkit-appearance: none; appearance: none; }
        .form-input::placeholder { color: var(--color-text-disabled); font-weight: 400; }
        .form-input:hover { border-color: var(--color-primary-300, #86efac); background: rgba(255,255,255,0.85); }
        .form-input:focus { border-color: var(--color-brand); background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(22,163,74,0.08), 0 1px 2px rgba(0,0,0,0.02); }
        .form-input:focus ~ .input-icon, .form-input:focus-within ~ .input-icon { color: var(--color-brand); }
        .form-input.error { border-color: var(--color-danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.08); }
        @media (prefers-color-scheme: dark) { .form-input { background: rgba(30,41,59,0.7); border-color: rgba(148,163,184,0.15); color: #f1f5f9; } .form-input::placeholder { color: rgba(148,163,184,0.4); } .form-input:hover { border-color: rgba(22,163,74,0.3); background: rgba(30,41,59,0.85); } .form-input:focus { border-color: var(--color-brand); background: rgba(30,41,59,0.95); box-shadow: 0 0 0 3px rgba(22,163,74,0.12); } }
        .password-strength { display: flex; gap: 4px; margin-top: 8px; }
        .strength-bar { height: 4px; flex: 1; border-radius: 2px; background: var(--color-border); transition: all 0.3s var(--ease-out); }
        .strength-bar.weak { background: #ef4444; }
        .strength-bar.medium { background: #f59e0b; }

        .btn-submit { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px 24px; border: none; border-radius: var(--radius-xl, 16px); font-family: inherit; font-size: 0.9375rem; font-weight: 700; letter-spacing: 0.01em; color: white; background: linear-gradient(135deg, var(--color-brand) 0%, #1a8a4a 100%); cursor: pointer; transition: all 0.25s var(--ease-out); box-shadow: 0 4px 14px rgba(22,163,74,0.25), inset 0 1px 0 rgba(255,255,255,0.15); -webkit-appearance: none; appearance: none; min-height: 52px; }
        .btn-submit:hover:not(:disabled) { transform: translateY(-1.5px); box-shadow: 0 8px 24px rgba(22,163,74,0.30), inset 0 1px 0 rgba(255,255,255,0.18); background: linear-gradient(135deg, var(--color-brand-dark) 0%, #0d7a3d 100%); }
        .btn-submit:active:not(:disabled) { transform: translateY(0); box-shadow: 0 2px 8px rgba(22,163,74,0.20), inset 0 1px 0 rgba(255,255,255,0.10); }

        .btn-loading .btn-text { opacity: 0; }

        .spinner-dot:nth-child(1) { animation-delay: 0s; }

        .access-panel { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px; padding: 12px 16px; border-radius: var(--radius-lg); background: rgba(22,163,74,0.04); border: 1px solid rgba(22,163,74,0.08); }
        .access-panel-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 500; color: var(--color-text-tertiary); }
        .access-panel-item svg { flex-shrink: 0; }
        @media (prefers-color-scheme: dark) { .access-panel { background: rgba(22,163,74,0.06); border-color: rgba(22,163,74,0.10); } .access-panel-item { color: rgba(148,163,184,0.7); } }
        .login-footer { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.04); }
        .login-footer p { font-size: 0.75rem; font-weight: 500; color: var(--color-text-tertiary); letter-spacing: 0.01em; }
        .login-footer a { color: var(--color-text-link); text-decoration: none; font-weight: 600; transition: color 0.2s var(--ease-out); }
        .login-footer a:hover { color: var(--color-brand-dark); }
        @media (prefers-color-scheme: dark) { .login-footer { border-top-color: rgba(255,255,255,0.04); } .login-footer p { color: rgba(148,163,184,0.5); } .login-footer a { color: var(--color-brand-light); } .login-footer a:hover { color: var(--color-brand); } }
        .step-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; }
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border); transition: all 0.3s var(--ease-out); }
        .step-dot.active { width: 24px; border-radius: 4px; background: var(--color-brand); }
        .step-dot.done { background: var(--color-brand-light); }
        .mobile-break { display: none; }
        @media (max-width: 480px) { .mobile-break { display: inline; } body { padding: 12px; } .login-card { padding: 32px 24px 28px; } .login-title { font-size: 1.375rem; } .login-logo { width: 48px; height: 48px; } .login-header { margin-bottom: 24px; } .login-form { gap: 16px; } .form-input { padding: 12px 14px 12px 40px; font-size: 0.875rem; } .btn-submit { padding: 14px 20px; font-size: 0.875rem; min-height: 48px; } .access-panel { flex-direction: column; gap: 8px; } }
        @media (min-width: 481px) and (max-width: 768px) { .login-card { padding: 40px 32px 32px; } }
        @media (min-width: 769px) { .login-card { padding: 44px 40px 36px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } .bg-orb { animation: none !important; } }
        :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }
        :focus:not(:focus-visible) { outline: none; }
    </style>
</head>
<body>
    <a href="#reset-form-content" class="skip-link" style="position:fixed;top:-100%;left:16px;z-index:9999;padding:10px 20px;border-radius:var(--radius-lg);background:var(--color-brand);color:white;font-size:0.875rem;font-weight:600;text-decoration:none;transition:top 0.2s var(--ease-out);">Lompat ke form reset password</a>
    <script>document.querySelector('.skip-link')?.addEventListener('focus', function(){ this.style.top='16px'; }); document.querySelector('.skip-link')?.addEventListener('blur', function(){ this.style.top='-100%'; });</script>

    <div class="bg-pattern" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

    <main class="login-wrapper" id="reset-form-content" role="main">

                        <span class="brand-highlight">Reset</span> Password

                    <div class="login-subtitle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <span>Buat Password Baru</span>
                    </div>
                </div>

                <div class="security-badge" role="status">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Buat Password Administrator Baru</span>

                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <span id="errorMessage"></span>
                </div>

                <form id="resetForm" class="login-form" autocomplete="off" novalidate aria-label="Form reset password admin">
                    <input type="hidden" id="emailInput" value="">
                    <input type="hidden" id="tokenInput" value="">

                    <div class="form-group">
                        <label for="newPassword" class="form-label">Password Baru</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="newPassword" name="new_password" class="form-input" placeholder="Min. 8 karakter" required autocomplete="new-password" aria-required="true" minlength="8">
                        </div>
                        <div id="passwordStrength" class="password-strength">
                            <span class="strength-bar"></span>
                            <span class="strength-bar"></span>
                            <span class="strength-bar"></span>
                            <span class="strength-bar"></span>
                        </div>
                        <span class="strength-text" id="strengthText">Masukkan password baru</span>
                    </div>

                    <div class="form-group">
                        <label for="newPassword2" class="form-label">Konfirmasi Password</label>

                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="newPassword2" name="new_password2" class="form-input" placeholder="Ketik ulang password baru" required autocomplete="new-password" aria-required="true" minlength="8">
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="resetBtn">
                        <span class="btn-text">
                            Simpan Password Baru
                            <span class="btn-icon-arrow" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                                </svg>
                            </span>
                        </span>
                        <span class="btn-spinner" aria-hidden="true">
                            <span class="spinner-dot"></span>
                            <span class="spinner-dot"></span>
                            <span class="spinner-dot"></span>
                        </span>
                    </button>
                </form>

                <div class="access-panel" role="group" aria-label="Informasi keamanan">
                    <span class="access-panel-item">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span>SSL Encrypted</span>
                    </span>
                    <span class="access-panel-item">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <span>Django Hashing</span>
                    </span>
                    <span class="access-panel-item">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <span>Admin Only</span>
                    </span>
                </div>

                <footer class="login-footer" role="contentinfo">
                    <p>&copy; 2026 <a href="https://warungio.com" target="_blank" rel="noopener noreferrer">Warungio</a>. All rights reserved. <br class="mobile-break">Hanya untuk administrator yang berwenang.</p>
                </footer>
            </div>
        </div>
    </main>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
    (function() {
        'use strict';

        var params = new URLSearchParams(window.location.search);
        var email = params.get('email') || '';
        var token = params.get('token') || '';

        if (!email || !token) {
            window.location.href = '/admin-panel/password/forgot/';
            return;
        }

        var form = document.getElementById('resetForm');
        var emailInput = document.getElementById('emailInput');
        var tokenInput = document.getElementById('tokenInput');
        var passwordInput = document.getElementById('newPassword');
        var password2Input = document.getElementById('newPassword2');
        var btn = document.getElementById('resetBtn');
        var errorEl = document.getElementById('resetError');
        var errorMessageEl = document.getElementById('errorMessage');
        var strengthBars = document.querySelectorAll('.strength-bar');
        var strengthText = document.getElementById('strengthText');

        emailInput.value = email;
        tokenInput.value = token;

        function showError(message) {
            errorMessageEl.textContent = message;
            errorEl.classList.add('is-visible');
        }

        function clearError() {
            errorEl.classList.remove('is-visible');
        }

        function setLoading(isLoading) {
            btn.disabled = isLoading;
            btn.classList.toggle('btn-loading', isLoading);
            btn.setAttribute('aria-busy', isLoading ? 'true' : 'false');
        }

        // Password strength meter
        function checkStrength(password) {
            var score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            var level = score <= 2 ? 'weak' : score <= 3 ? 'medium' : score <= 4 ? 'strong' : 'very-strong';
            var label = score <= 2 ? 'Lemah' : score <= 3 ? 'Sedang' : score <= 4 ? 'Kuat' : 'Sangat Kuat';
            var color = score <= 2 ? '#ef4444' : score <= 3 ? '#f59e0b' : score <= 4 ? '#22c55e' : '#16a34a';

            // Show bars
            var filledBars = Math.min(Math.ceil(score / 1.5), 4);
            strengthBars.forEach(function(bar, i) {
                bar.className = 'strength-bar';
                if (i < filledBars) {
                    bar.style.background = color;
                } else {
                    bar.style.background = 'var(--color-border)';
                }
            });

            strengthText.textContent = 'Kekuatan password: ' + label;
            strengthText.style.color = color;
        }

        passwordInput.addEventListener('input', function() {
            if (this.value.length === 0) {
                strengthBars.forEach(function(bar) { bar.className = 'strength-bar'; bar.style.background = 'var(--color-border)'; });
                strengthText.textContent = 'Masukkan password baru';
                strengthText.style.color = 'var(--color-text-tertiary)';
            } else {
                checkStrength(this.value);
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearError();

            var password = passwordInput.value;
            var password2 = password2Input.value;

            if (!password || password.length < 8) {
                showError('Password minimal 8 karakter.');
                passwordInput.focus();
                return;
            }

            if (password !== password2) {
                showError('Konfirmasi password tidak cocok.');
                password2Input.focus();
                return;
            }

            setLoading(true);

            try {
                var response = await fetch('/admin-panel/api/password/reset/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({
                        email: email,
                        otp_code: '',
                        new_password: password,
                        new_password2: password2,
                        verification_token: token,
                    }),
                });

                var data = await response.json();

                if (data.success) {
                    // Show success and redirect to login page
                    window.location.href = '/admin-panel/login/?reset=1';
                } else {
                    showError(data.message || 'Gagal mereset password. Silakan coba lagi.');
                    if (data.code === 'token_expired' || data.code === 'invalid_token') {
                        setTimeout(function() {
                            window.location.href = '/admin-panel/password/forgot/';
                        }, 2000);
                    }
                }
            } catch (err) {
                showError('Gagal terhubung ke server. Silakan coba lagi.');
            } finally {
                setLoading(false);
            }
        });

        passwordInput.focus();
    })();
    </script>
</body>
</html>
