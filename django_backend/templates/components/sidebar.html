{% load static %}
<aside class="sidebar" data-aos="fade-right" data-aos-duration="600">
    <div class="sidebar-header">
        <div class="brand-name">
            <img src="{% static 'images/Warungio L.png' %}" alt="Warungio Logo" class="brand-logo-img">
            <span class="logo-text">Warung<span class="logo-green">io</span></span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'page-buyer-home' %}" class="nav-link {% if request.path == '/buyer/home/' or request.path == '/home/' %}active{% endif %}">
            <i class="fa-regular fa-compass"></i>
            <span>Beranda</span>
        </a>
        <a href="{% url 'page-products' %}" class="nav-link {% if '/products/' in request.path %}active{% endif %}">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>Produk</span>
        </a>
        <a href="{% url 'page-buyer-home' %}#warung-section" class="nav-link">
            <i class="fa-solid fa-store"></i>
            <span>Warung Terdekat</span>
        </a>
        <a href="{% url 'page-favorites' %}" class="nav-link {% if '/favorites/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-heart"></i>
            <span>Favorit</span>
        </a>
        <a href="{% url 'page-buyer-orders' %}" class="nav-link {% if '/orders/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-receipt"></i>
            <span>Pesanan Saya</span>
            <span class="nav-badge" id="sidebarOrderBadge">1</span>
        </a>
        <div class="px-4 py-2 mt-4 text-[10px] font-extrabold text-slate-400 tracking-wider uppercase">Layanan</div>
        <a href="{% url 'page-buyer-dashboard' %}" class="nav-link {% if '/dashboard/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-circle-check"></i>
            <span>Langganan</span>
            <span class="nav-badge new-badge">Baru</span>
        </a>
        <a href="{% url 'page-promo' %}" class="nav-link {% if '/promo/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-percentage"></i>
            <span>Promo</span>
        </a>
        <a href="{% url 'page-wallet' %}" class="nav-link {% if '/wallet/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-wallet"></i>
            <span>Dompet Saya</span>
        </a>
        <a href="{% url 'page-buyer-reviews' %}" class="nav-link {% if '/reviews/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-star"></i>
            <span>Penilaian</span>
        </a>
        <a href="{% url 'bantuan-page' %}" class="nav-link {% if '/bantuan/' in request.path %}active{% endif %}">
            <i class="fa-regular fa-circle-question"></i>
            <span>Bantuan</span>
        </a>
        <a href="{% url 'page-settings' %}" class="nav-link {% if '/settings/' in request.path %}active{% endif %}">
            <i class="fa-solid fa-gear"></i>
            <span>Pengaturan</span>
        </a>
    </nav>

    <!-- Bottom Widget: Warungio Points -->
    <div class="sidebar-points-widget">
        <div class="points-header">
            <i class="fa-solid fa-award points-icon"></i>
            <span>Warungio Points</span>
        </div>
        <div class="points-value" id="sidebarPointsValue">1.250 Poin</div>
        <a href="{% url 'page-buyer-dashboard' %}" class="points-link">Lihat Detail <i class="fa-solid fa-chevron-right"></i></a>
    </div>
</aside>
