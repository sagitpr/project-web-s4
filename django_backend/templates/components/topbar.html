{% load static %}
<!-- Sticky Glassmorphic Top Navigation -->
<header class="topbar">
    <div class="topbar-left-group" style="display: flex; align-items: center; gap: 16px; flex: 1; max-width: 800px;">
        <div class="menu-toggle" id="menuToggle">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>

        <!-- Search Bar (Left aligned) -->
        <div class="search-panel" style="flex: 1; max-width: 480px; width: 100%;">
            <div class="search-input">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="searchInput" placeholder="Cari produk, warung, atau kategori..." autocomplete="off">
            </div>
        </div>

        <!-- Location Selector (Center/Right of search bar) -->
        <div class="topbar-location">
            <i class="fa-solid fa-location-dot"></i>
            <div class="location-info">
                <span class="location-label">Kirim ke</span>
                <span class="location-value" id="userLocation">Pilih Lokasi...</span>
            </div>
            <i class="fa-solid fa-chevron-down location-arrow" style="margin-left: 8px; color: #64748B; font-size: 10px;"></i>
        </div>
    </div>

    <div class="topbar-actions">
        <!-- Authenticated Actions (Toggled by JS) -->
        <div id="authHeaderActions" style="display: none; align-items: center; gap: 14px;">
            <button class="icon-btn-premium" onclick="window.location.href='/buyer/chat/'" title="Chat">
                <i class="fa-regular fa-comment-dots"></i>
                <span class="icon-badge badge-green" id="chatBadgeHeader" style="display:none;">0</span>
            </button>
            <button class="icon-btn-premium" onclick="window.location.href='/buyer/cart/'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="icon-badge badge-green" id="cartBadgeHeader">0</span>
            </button>
            <button class="icon-btn-premium" id="notificationBtn">
                <i class="fa-regular fa-bell"></i>
                <span class="icon-badge badge-green" id="notifBadgeHeader">0</span>
            </button>
            
            <div class="profile-dropdown-wrapper">
                <div class="profile-avatar-only" id="profileBox" style="cursor: pointer; display: flex; align-items: center;">
                    <img src="{% static 'images/av-siti.png' %}" alt="Profile" class="profile-avatar" id="userAvatar" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #E5E7EB; object-fit: cover;">
                </div>
                <div class="dropdown-menu-custom" id="dropdownMenu">
                    <div class="dropdown-user-header" style="padding: 12px 16px; border-bottom: 1px solid #F1F5F9; margin-bottom: 6px;">
                        <p id="userName" class="profile-name" style="font-weight: 700; color: #0F172A; margin: 0; font-size: 13px;">Hai, User</p>
                        <span class="member-badge-premium" id="userRoleBadge" style="font-size: 10px; color: #16A34A; font-weight: 700;">Member</span>
                    </div>
                    <a href="/buyer/profile/"><i class="fa-solid fa-user"></i> Profil Saya</a>
                    <a href="/buyer/dashboard/"><i class="fa-solid fa-house"></i> Dashboard Saya</a>
                    <a href="/buyer/profile/"><i class="fa-solid fa-gear"></i> Pengaturan</a>
                    <a href="#" class="btn-topup"><i class="fa-solid fa-wallet"></i> Top Up Saldo <span id="userBalanceDropdown" style="margin-left: auto; font-weight: 700; color: var(--primary);">Rp 0</span></a>
                    <a href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </div>
        </div>

        <!-- Guest Actions -->
        <div id="guestHeaderActions" style="display: flex; gap: 8px; align-items: center;">
            <span class="guest-role-label" style="font-size:11px;font-weight:600;color:#94a3b8;padding:0 4px;letter-spacing:0.3px;">Pembeli</span>
            <a href="{% url 'page-login' %}" class="btn-login-premium">Masuk</a>
            <a href="{% url 'page-register' %}" class="btn-register-premium">Daftar</a>
            <span class="guest-role-divider" style="width:1px;height:20px;background:#e2e8f0;margin:0 6px;"></span>
            <span class="guest-role-label" style="font-size:11px;font-weight:600;color:#94a3b8;padding:0 4px;letter-spacing:0.3px;">Mitra</span>
            <a href="{% url 'page-login-seller' %}" class="btn-seller-premium">Login Seller</a>
            <a href="{% url 'page-register-mitra' %}" class="btn-mitra-premium">Daftar Mitra</a>
        </div>
    </div>
</header>
