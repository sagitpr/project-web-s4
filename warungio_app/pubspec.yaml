name: warungio_app
description: Warungio Marketplace - Hyperlocal mobile marketplace for Indonesian daily needs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Navigation
  go_router: ^14.2.0

  # Local Storage
  shared_preferences: ^2.3.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Device & Platform
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0

  # Push Notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1+2

  # Utils
  logger: ^2.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
