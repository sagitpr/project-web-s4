# =============================================================================
# Warungio Marketplace — Nginx DEV Configuration
# No SSL — for local development with docker-compose
# =============================================================================

upstream django {
    server django:8000;
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;

    # Security headers (dev-friendly)
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Max upload size
    client_max_body_size 10M;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (favicon, images, etc.) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Django Application (includes WebSocket support) ──
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Health check ──
    location /health/ {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
