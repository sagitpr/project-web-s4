# =============================================================================
# Warungio Marketplace — Nginx Site Configuration (DEVELOPMENT ONLY)
# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  ⚠️  DEVELOPMENT CONFIG — NOT FOR PRODUCTION USE                     ║
# ║                                                                      ║
# ║  Server name: localhost / 127.0.0.1                                  ║
# ║  Protocol:     Plain HTTP (NO SSL)                                   ║
# ║                                                                      ║
# ║  For production deployment, always use:                              ║
# ║    docker compose -f docker-compose.yml -f docker-compose.prod.yml   ║
# ╚═══════════════════════════════════════════════════════════════════════╝
# =============================================================================
# HOW THIS FILE IS LOADED:
#   docker-compose.override.yml (auto-loaded for local development only)
#   replaces nginx/warungio.conf → this file so SSL certs are not required.
#
# PRODUCTION SSL CONFIG:
#   Located in nginx/warungio.conf with server_name: warungio.web.id
#   Activated automatically when using explicit -f flags:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

upstream django {
    server django:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;

    # Max upload size
    client_max_body_size 10M;

    # ── Proxy buffer — hemat memory ──
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (PWA manifest, service worker) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Frontend SPA assets (auth, buyer, seller pages) ──
    # Use root (not alias) so try_files $uri resolves to correct filesystem path.
    # try_files $uri @django: only exact file matches (CSS, JS) are served directly.
    # Directory paths fall through to Django's TemplateView for auth.
    location /auth/ {
        root /app;
        try_files $uri @django;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location /buyer/ {
        root /app;
        try_files $uri @django;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location /seller/ {
        root /app;
        try_files $uri @django;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location /home/ {
        root /app;
        try_files $uri @django;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Named location for Django fallback
    location @django {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── Download files (APK, IPA — internal redirects via X-Accel) ──
    location /download-files/ {
        internal;
        alias /app/django_backend/downloads/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        types { application/vnd.android.package-archive apk; }
        access_log off;
    }

    # ── Health check (no rate limit, no cache) ──
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # ── API Endpoints (no WebSocket needed for REST API) ──
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Django Application (HTML pages, auth, WebSocket) ──
    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # ── WebSocket specific — long timeout, no buffering ──
    location /ws/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
