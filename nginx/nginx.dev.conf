# =============================================================================
# Warungio Marketplace — Nginx Site Configuration (Production HTTPS)
# Reverse proxy to Django Daphne ASGI server with Let's Encrypt SSL
# Mounted as /etc/nginx/conf.d/warungio.conf
# =============================================================================

upstream django {
    server django:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name warungio.web.id www.warungio.web.id 36.50.77.237;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name warungio.web.id www.warungio.web.id;

    # ── Let's Encrypt SSL ──────────────────────────────────────────────────
    # Live symlinks: /etc/letsencrypt/live/warungio.web.id/ → ../../archive/warungio.web.id/cert1.pem
    # Mount: docker-compose.yml mounts /etc/letsencrypt:/etc/letsencrypt:ro
    ssl_certificate     /etc/letsencrypt/live/warungio.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warungio.web.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/warungio.web.id/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header X-Permitted-Cross-Domain-Policies "none";
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(self), fullscreen=(self), autoplay=(self), display-capture=(), encrypted-media=(self), picture-in-picture=(), screen-wake-lock=(), usb=(), serial=(), midi=(), hid=(), sync-xhr=(), publickey-credentials-get=(self), web-share=(self)";
    # ── Content Security Policy (tanpa wildcard) ──
    # Domain-domain eksak yang digunakan Warungio:
    # Google Fonts: fonts.googleapis.com, fonts.gstatic.com
    # Google Maps JS API: maps.googleapis.com, maps.gstatic.com
    # Google Identity (GSI): accounts.google.com
    # Google reCAPTCHA: www.google.com/recaptcha, www.gstatic.com/recaptcha, recaptcha.google.com
    # Facebook SDK: connect.facebook.net, www.facebook.com, facebook.com
    # Apple Sign-In: appleid.cdn-apple.com, appleid.apple.com
    # Midtrans Snap: app.midtrans.com, app.sandbox.midtrans.com, api.midtrans.com
    # CDNs: cdnjs.cloudflare.com, cdn.jsdelivr.net, unpkg.com
    # Google profile photos: lh3.googleusercontent.com
    # Tailwind CDN: cdn.tailwindcss.com
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://connect.facebook.net https://appleid.cdn-apple.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://app.midtrans.com https://app.sandbox.midtrans.com https://maps.googleapis.com https://maps.gstatic.com https://www.google.com https://www.gstatic.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com https://accounts.google.com https://maps.gstatic.com; img-src 'self' data: blob: https://maps.googleapis.com https://*.googleapis.com https://maps.gstatic.com https://www.google.com https://www.gstatic.com https://lh3.googleusercontent.com https://connect.facebook.net https://facebook.com https://app.midtrans.com https://app.sandbox.midtrans.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://via.placeholder.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' wss://warungio.web.id wss://www.warungio.web.id https://api.midtrans.com https://app.midtrans.com https://app.sandbox.midtrans.com https://maps.googleapis.com https://*.googleapis.com https://maps.gstatic.com https://accounts.google.com https://connect.facebook.net https://appleid.apple.com https://www.google.com https://www.gstatic.com; form-action 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; frame-src https://accounts.google.com https://connect.facebook.net https://appleid.apple.com https://app.midtrans.com https://app.sandbox.midtrans.com https://www.google.com https://recaptcha.google.com; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self';";

    # OCSP Stapling (percepat SSL handshake)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Max upload size
    client_max_body_size 10M;

    # ── Proxy buffer — hemat memory ──
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (favicon, images, etc.) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check (no rate limit, no SSL redirect) ──
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # ── API GET Microcache (cache GET 60 detik, skip auth requests) ──
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        # Hanya cache GET requests — skip POST/PUT/PATCH/DELETE
        set $do_cache '';
        if ($request_method = GET) {
            set $do_cache '1';
        }
        # Skip cache jika ada Authorization header (user-specific data)
        if ($http_authorization) {
            set $do_cache '';
        }

        proxy_cache api_cache;
        proxy_cache_key $scheme$request_method$host$request_uri;
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_no_cache $do_cache;
        proxy_cache_bypass $do_cache;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Django Application (non-API: HTML pages, auth pages, WebSocket) ──
    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (Daphne/Channels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffer settings for streaming
        proxy_buffering off;
    }
}
