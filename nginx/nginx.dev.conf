# =============================================================================
# Warungio Marketplace — Nginx Site Configuration (Dev + Non-SSL Production)
# Reverse proxy to Django Daphne ASGI server with static/media serving
# Mounted as /etc/nginx/conf.d/default.conf (overwrites Alpine default)
# =============================================================================

upstream django {
    server django:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name warungio.web.id www.warungio.web.id 36.50.77.237;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none';";

    # Rate limiting
    limit_req zone=api burst=20 nodelay;

    # Max upload size
    client_max_body_size 10M;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (favicon, images, etc.) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check ──
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # ── Django Application (HTTP + WebSocket) ──
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (Daphne/Channels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffer settings for streaming
        proxy_buffering off;
    }
}
