# =============================================================================
# Warungio Marketplace — Nginx Site Configuration (Production HTTPS)
# Reverse proxy to Django Daphne ASGI server with Let's Encrypt SSL
# Mounted as /etc/nginx/conf.d/warungio.conf
# =============================================================================

upstream django {
    server django:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name warungio.web.id www.warungio.web.id 36.50.77.237;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name warungio.web.id www.warungio.web.id;

    # ── Let's Encrypt SSL ──────────────────────────────────────────────────
    # Live symlinks: /etc/letsencrypt/live/warungio.web.id/ → ../../archive/warungio.web.id/cert1.pem
    # Mount: docker-compose.yml mounts /etc/letsencrypt:/etc/letsencrypt:ro
    ssl_certificate     /etc/letsencrypt/live/warungio.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warungio.web.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/warungio.web.id/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    # ── Content Security Policy ──
    # Mengizinkan semua resource eksternal yang digunakan Warungio:
    # Google Fonts/OAuth/Maps, Facebook SDK, Apple Sign-In,
    # Midtrans Snap, Font Awesome (cdnjs), Chart.js (jsdelivr),
    # AOS + Leaflet (unpkg), Tailwind CDN, WebSocket, placeholder.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://connect.facebook.net https://appleid.cdn-apple.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://app.midtrans.com https://app.sandbox.midtrans.com https://maps.googleapis.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; img-src 'self' data: blob: https://via.placeholder.com https://*.google.com https://*.gstatic.com https://*.googleusercontent.com https://connect.facebook.net https://*.midtrans.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' wss://warungio.web.id wss://www.warungio.web.id https://api.midtrans.com https://app.midtrans.com https://app.sandbox.midtrans.com https://maps.googleapis.com https://accounts.google.com https://connect.facebook.net https://appleid.apple.com; frame-src https://accounts.google.com https://connect.facebook.net https://appleid.apple.com https://app.midtrans.com https://app.sandbox.midtrans.com https://www.google.com https://maps.googleapis.com; frame-ancestors 'none';";

    # Rate limiting
    limit_req zone=api burst=20 nodelay;

    # Max upload size
    client_max_body_size 10M;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (favicon, images, etc.) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check ──
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # ── Django Application (HTTP + WebSocket) ──
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (Daphne/Channels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffer settings for streaming
        proxy_buffering off;
    }
}
