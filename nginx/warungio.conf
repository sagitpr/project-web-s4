# =============================================================================
# Warungio Marketplace — Nginx PRODUCTION Configuration (SSL)
# SSL termination, HTTP→HTTPS redirect, reverse proxy to Daphne
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# =============================================================================

upstream django {
    server django:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name warungio.com www.warungio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name warungio.com www.warungio.com;

    # SSL — paths aligned with docker-compose mount: ./nginx/ssl:/etc/nginx/ssl
    ssl_certificate /etc/nginx/ssl/warungio.crt;
    ssl_certificate_key /etc/nginx/ssl/warungio.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none';";

    # Max upload size
    client_max_body_size 10M;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (favicon, images, etc.) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check (no rate limit) ──
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # ── Django Application ──
    location / {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── WebSocket specific ──
    location /ws/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
