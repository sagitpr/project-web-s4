# =============================================================================
# Warungio Marketplace — Nginx PRODUCTION Configuration (SSL)
# SSL termination, HTTP→HTTPS redirect, reverse proxy to Daphne
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# =============================================================================

upstream django {
    server django:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name warungio.com www.warungio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name warungio.com www.warungio.com;

    # SSL — paths aligned with docker-compose mount: ./nginx/ssl:/etc/nginx/ssl
    ssl_certificate /etc/nginx/ssl/warungio.crt;
    ssl_certificate_key /etc/nginx/ssl/warungio.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling (percepat SSL handshake)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header X-Permitted-Cross-Domain-Policies "none";
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(self), fullscreen=(self), autoplay=(self), display-capture=(), encrypted-media=(self), picture-in-picture=(), screen-wake-lock=(), usb=(), serial=(), midi=(), hid=(), sync-xhr=(), publickey-credentials-get=(self), web-share=(self)";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://connect.facebook.net https://appleid.cdn-apple.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://app.midtrans.com https://app.sandbox.midtrans.com https://maps.googleapis.com https://maps.gstatic.com https://www.google.com https://www.gstatic.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com https://accounts.google.com https://maps.gstatic.com; img-src 'self' data: blob: https://maps.googleapis.com https://*.googleapis.com https://maps.gstatic.com https://www.google.com https://www.gstatic.com https://lh3.googleusercontent.com https://connect.facebook.net https://facebook.com https://app.midtrans.com https://app.sandbox.midtrans.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://via.placeholder.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' wss://warungio.com wss://www.warungio.com https://api.midtrans.com https://app.midtrans.com https://app.sandbox.midtrans.com https://maps.googleapis.com https://*.googleapis.com https://maps.gstatic.com https://accounts.google.com https://connect.facebook.net https://appleid.apple.com https://www.google.com https://www.gstatic.com; form-action 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; frame-src https://accounts.google.com https://connect.facebook.net https://appleid.apple.com https://app.midtrans.com https://app.sandbox.midtrans.com https://www.google.com https://recaptcha.google.com; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self';";

    # Max upload size
    client_max_body_size 10M;

    # ── Proxy buffer — minimal for 1GB VPS ──
    # Enable buffering for normal requests (reduces memory per connection)
    # WebSocket connections bypass buffering via location-specific config
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;
    proxy_buffering on;

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ──
    location /media/ {
        alias /app/django_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Assets (favicon, images, etc.) ──
    location /assets/ {
        alias /app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Download files (APK, IPA — internal redirects via X-Accel) ──
    # APK files are served via Nginx for efficiency (zero Python overhead).
    # Django validates the request, then sets X-Accel-Redirect header to
    # this internal location. Direct access to /download-files/ is blocked.
    location /download-files/ {
        internal;
        alias /app/django_backend/downloads/;
        
        # Force download with proper Content-Type regardless of file extension
        add_header Content-Disposition "attachment";
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        
        # Don't cache APK/IPA files
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # APK MIME type override (Nginx may default to application/octet-stream)
        types { application/vnd.android.package-archive apk; }
        
        access_log off;
    }

    # ── Health check (no rate limit) ──
    location /health/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }

    # ── Django Application ──
    location / {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 300s timeout for normal requests (3600s was excessive for 1GB VPS)
        # Long timeout was causing connection backlog under load
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # ── WebSocket specific — keep long timeout for persistent connections ──
    location /ws/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
