# =============================================================================
# Warungio Marketplace — Nginx Main Configuration
# OPTIMIZED for 1 vCPU / 1 GB RAM VPS
# =============================================================================

user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging — minimal untuk hemat I/O
    # Production: access_log off saves ~10% I/O on VPS
    # Uncomment below if access logs are needed for debugging
    access_log off;
    # log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    #                 '$status $body_bytes_sent "$http_referer" '
    #                 '"$http_user_agent" "$http_x_forwarded_for"';
    # access_log /var/log/nginx/access.log main buffer=32k flush=5m;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    
    # Open file cache — kurangi disk I/O untuk static files
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Client body buffer — hemat memory untuk request kecil
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_max_body_size 5M;

    # Gzip — level 2 is optimal for 1 vCPU (minimal CPU, good compression)
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 2;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Security
    server_tokens off;

    # Rate limiting — adjusted for 1GB VPS capacity
    # 50 req/s with burst 20 allows legitimate page loads without false throttling
    limit_req_zone $binary_remote_addr zone=api:5m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

    # ── Explicit Temp Paths ──
    # Nginx membutuhkan direktori temp untuk berbagai operasi:
    #   client_body_temp → upload file sebelum diteruskan ke backend
    #   proxy_temp       → proxy buffering (jika proxy_buffering on)
    #   fastcgi_temp     → FastCGI buffering
    #   uwsgi_temp       → uWSGI buffering
    #   scgi_temp        → SCGI buffering
    #
    # Semua direktori di bawah /var/cache/nginx/. Nginx master (root) akan
    # chown direktori ini ke user 'nginx' (UID 101) saat startup.
    #
    # Container membutuhkan CAP_CHOWN agar chown() berhasil.
    # Lihat docker-compose.yml → nginx → cap_add.
    client_body_temp_path /var/cache/nginx/client_body_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;

    # ── Proxy Cache — DISABLED ──
    # Application-level caching (Redis via Django cache framework) is sufficient.
    # proxy_cache_path is intentionally omitted. No Nginx-level proxy caching.

    # Include site configs
    include /etc/nginx/conf.d/*.conf;
}
