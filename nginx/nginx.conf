# =============================================================================
# Warungio Marketplace — Nginx Main Configuration
# OPTIMIZED for 1 vCPU / 1 GB RAM VPS
# =============================================================================

user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging — minimal untuk hemat I/O
    # Production: access_log off saves ~10% I/O on VPS
    # Uncomment below if access logs are needed for debugging
    access_log off;
    # log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    #                 '$status $body_bytes_sent "$http_referer" '
    #                 '"$http_user_agent" "$http_x_forwarded_for"';
    # access_log /var/log/nginx/access.log main buffer=32k flush=5m;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    
    # Open file cache — kurangi disk I/O untuk static files
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Client body buffer — hemat memory untuk request kecil
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_max_body_size 5M;

    # Gzip — level 2 is optimal for 1 vCPU (minimal CPU, good compression)
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 2;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Security
    server_tokens off;

    # Rate limiting — adjusted for 1GB VPS capacity
    # 50 req/s with burst 20 allows legitimate page loads without false throttling
    limit_req_zone $binary_remote_addr zone=api:5m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

    # ── Proxy Cache — Active caching for API responses ──
    # 50M cache = ~12,500 API responses at 4KB each. Cache GET responses for 60s.
    # The directory is auto-created by nginx on first use.
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:5m max_size=50m inactive=10m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    # Skip caching non-GET/HEAD and authenticated requests
    proxy_cache_bypass $http_cache_control $http_authorization $http_x_csrftoken;
    proxy_no_cache $http_cache_control $http_authorization $http_x_csrftoken;
    # Serve stale cache while updating upstream (upstream timeout resilience)
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    # Cache valid for successful responses
    proxy_cache_valid 200 301 302 60s;
    # Lock to prevent multiple requests fetching the same uncached resource
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    # Include site configs
    include /etc/nginx/conf.d/*.conf;
}
