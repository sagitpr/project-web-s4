name: Django CI

on:
  push:
    branches: [main, master]
    paths:
      - "django_backend/**"
      - ".github/workflows/django.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "django_backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: config.settings
  REDIS_URL: ""
  CHANNEL_LAYERS_BACKEND: channels.layers.InMemoryChannelLayer
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_DEBUG: "False"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_backend

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}
          MARIADB_DATABASE: warungio_test
          MARIADB_USER: warungio
          MARIADB_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'warungio_pass' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -p${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: django_backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev-compat libmariadb-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-asyncio

      - name: Run Django system check
        run: python manage.py check
        env:
          DEBUG: "True"

      - name: Run pytest (all apps)
        run: python -m pytest -v --tb=short --no-header --reuse-db
        env:
          USE_MYSQL: "False"
          REDIS_URL: ""
          CHANNEL_LAYERS_BACKEND: channels.layers.InMemoryChannelLayer

      - name: Run pytest with MySQL (smoke test)
        run: |
          python -m pytest -v --tb=short --no-header -x -k "test_create_user or test_login" accounts/tests.py
        env:
          USE_MYSQL: "True"
          MYSQL_DATABASE: warungio_test
          MYSQL_USER: warungio
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'warungio_pass' }}
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          REDIS_URL: ""
          CHANNEL_LAYERS_BACKEND: channels.layers.InMemoryChannelLayer
        if: always()

      - name: Run Django deployment check
        run: python manage.py check --deploy 2>&1 || true
        env:
          DEBUG: "False"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: django_backend/test-results/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: django_backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        run: black --check --diff . || true
