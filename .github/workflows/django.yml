# =============================================================================
# Warungio Marketplace — Django CI (Consolidated)
# =============================================================================
# Consolidated from ci.yml + django.yml into one comprehensive workflow.
# - Python matrix: 3.11, 3.12 with pip cache
# - MariaDB + Redis service containers
# - Full test suite on SQLite + MySQL
# - Ruff linter (modern, fast — replaces flake8+black)
# - Deployment check
# =============================================================================

name: Django CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "django_backend/**"
      - ".github/workflows/django.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "django_backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: django_backend

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}
          MARIADB_DATABASE: warungio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -u root -p${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: django_backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev-compat libmariadb-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-asyncio

      - name: Run Django system check
        run: python manage.py check

      - name: Run tests (SQLite — full suite)
        run: python -m pytest -v --tb=short --no-header --reuse-db -k 'not SocialAuthTests' --junitxml=test-results.xml
        env:
          USE_MYSQL: "False"
          REDIS_URL: ""
          CHANNEL_LAYERS_BACKEND: channels.layers.InMemoryChannelLayer

      - name: Run tests (MySQL — full suite)
        if: always()  # Run even if SQLite tests fail — MySQL-specific failures are valuable
        run: python -m pytest -v --tb=short --no-header --reuse-db -k 'not SocialAuthTests' --junitxml=test-results-mysql.xml
        env:
          USE_MYSQL: "True"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}
          DB_NAME: warungio_test
          REDIS_URL: ""
          CHANNEL_LAYERS_BACKEND: channels.layers.InMemoryChannelLayer

      - name: Run Django deployment check
        run: python manage.py check --deploy 2>&1 || true
        env:
          DJANGO_DEBUG: "False"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: django_backend/test-results*.xml
          if-no-files-found: ignore

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: "pip"
          cache-dependency-path: django_backend/requirements.txt

      - name: Install dependencies
        run: pip install ruff

      - name: Run Ruff linter
        run: |
          ruff check . --ignore=E501,F403,F405,W292 --exclude=migrations,venv
