name: Django CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'django_backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'django_backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}
          MARIADB_DATABASE: warungio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -u root -p${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev libmariadb-dev-compat gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django_backend/requirements.txt

      - name: Run Django system checks
        run: |
          cd django_backend
          python manage.py check
        env:
          USE_MYSQL: 'True'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}
          DB_NAME: warungio_test

      - name: Run migrations
        run: |
          cd django_backend
          python manage.py migrate
        env:
          USE_MYSQL: 'True'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: testpass123
          DB_NAME: warungio_test

      - name: Run tests
        run: |
          cd django_backend
          python -m pytest -v --tb=short --no-header --reuse-db \
            -k 'not SocialAuthTests' \
            --junitxml=test-results.xml
        env:
          USE_MYSQL: 'True'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD || 'testpass123' }}
          DB_NAME: warungio_test
          REDIS_URL: ''
          CHANNEL_LAYERS_BACKEND: 'channels.layers.InMemoryChannelLayer'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: django_backend/test-results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Run Ruff linter
        run: |
          cd django_backend
          ruff check . --ignore=E501,F403,F405,W292 --exclude=migrations,venv
