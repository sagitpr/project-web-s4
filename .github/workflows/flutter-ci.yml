name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'warungio_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'warungio_app/**'

env:
  flutter_version: '3.24.x'
  working_directory: ./warungio_app

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Unit Tests
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --coverage --machine

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ env.working_directory }}/coverage
          fail_ci_if_error: false
          verbose: true

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warungio-debug-apk
          path: ${{ env.working_directory }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  build-ios:
    name: Build iOS (Xcode)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (debug)
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: warungio-debug-ios
          path: ${{ env.working_directory }}/build/ios/iphoneos
          retention-days: 7
