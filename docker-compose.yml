# =============================================================================
# Warungio Marketplace — Docker Compose (Production — 1GB RAM Optimized)
# Services: Django (Daphne), MariaDB, Redis, Nginx, Celery Worker, Celery Beat
# Target: Ubuntu VPS with 1GB RAM
# =============================================================================

services:
  # ---- MariaDB Database (Low Memory: 96M buffer pool, 30 connections) ----
  mysql:
    image: mariadb:10.11
    container_name: warungio-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/warungio_full_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mariadb/conf.d/low-memory.cnf:/etc/mysql/mariadb.conf.d/99-low-memory.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 256m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Redis (Channels, Cache) — 64MB Max Memory ----
  redis:
    image: redis:7-alpine
    container_name: warungio-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 48m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Django Backend (Daphne ASGI — 1 Worker) ----
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-django
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "8000"
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "false"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/django_backend/media
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    mem_limit: 256m
    # Memory limit lebih rendah karena nginx handle static files,
    # dan WhiteNoise dinonaktifkan di production (tidak perlu load static ke memory)
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Celery Worker (Async Tasks) — WITH EMBEDDED BEAT ----
  # 1 concurrency, 500 max tasks per child, 5 min time limit
  # Beat dijalankan embedded (-B) untuk hemat memory (tidak perlu container terpisah)
  # --without-heartbeat --without-gossip --without-mingle: matikan discovery protocol
  # celery worker akan restart setelah 500 tasks untuk cegah memory leak
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-celery
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "true"
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "-c", "1", "--max-tasks-per-child=500", "-n", "worker@%h", "--without-heartbeat", "--without-gossip", "--without-mingle"]
    volumes:
      - ./logs:/app/logs
    # Healthcheck: lightweight process check instead of heavy app-loading `celery inspect ping`
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 128m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ---- Nginx (Reverse Proxy, Static/Media) ----
  nginx:
    image: nginx:1.25-alpine
    container_name: warungio-nginx
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/warungio.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/django_backend/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./assets:/app/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 48m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  warungio_net:
    driver: bridge
