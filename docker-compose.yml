# =============================================================================
# Warungio Marketplace — Docker Compose
# AGGRESSIVELY OPTIMIZED for 1 vCPU / 1 GB RAM Hard Limit
# Total allocated: 736 MB → leaves 264 MB for OS + burst
# =============================================================================

services:
  # ---- MariaDB Database (Ultra Low Memory: 64M buffer pool, 20 connections) ----
  mysql:
    image: mariadb:10.11
    container_name: warungio-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/warungio_full_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MariaDB low-memory config: innodb_buffer_pool_size=64M, max_connections=20
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 192m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Redis (Channels, Cache, Celery Broker) — 256MB Max Memory ----
  # CRITICAL: mem_limit MUST be higher than --maxmemory to avoid OOM kills.
  # Redis uses --maxmemory for internal data, but also needs overhead for
  # client buffers, replication backlog, and connection memory.
  # Set mem_limit ~25% above maxmemory to provide safe headroom.
  redis:
    image: redis:7-alpine
    container_name: warungio-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Django Backend (Daphne ASGI — Single Worker, 2 Threads per Connection) ----
  # ═══════════════════════════════════════════════════════════════════════
  # NOTE BuildKit: Dockerfile menggunakan --mount=type=cache (BuildKit).
  # Pastikan environment variable berikut diset sebelum build:
  #   export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
  # ═══════════════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════════════
  # NOTE Static files: collectstatic dijalankan SETIAP container startup
  # (lihat docker-entrypoint.sh) untuk memastikan Docker named volume
  # (static_volume) selalu sync dengan source code terbaru.
  #
  # Named volume persist meskipun image di-rebuild. Tanpa collectstatic
  # di startup, perubahan CSS/JS tidak akan muncul di volume yang ada.
  # Biaya: ~1-2 detik untuk ~6 file (negligible pada 1GB RAM VPS).
  # ═══════════════════════════════════════════════════════════════════════
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-django
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "8000"
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "false"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/django_backend/media
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --connect-timeout 5 http://localhost:8000/health/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    mem_limit: 192m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Celery Worker (Async Tasks) — NO embedded beat (separate container) ----
  # 1 concurrency, 500 max tasks per child, 5 min time limit
  # --without-heartbeat --without-gossip --without-mingle: matikan discovery protocol
  # Worker restart setelah 500 tasks untuk cegah memory leak.
  # Beat dijalankan di container terpisah (celery-beat) untuk:
  #   - Mencegah OOM kill (exit code 137) pada 1GB RAM VPS
  #   - Isolasi memory: worker bisa pakai 128m, beat cukup 32m
  #   - Worker restart karena max-tasks-per-child tidak ganggu beat scheduler
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-celery
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "true"
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "1", "--max-tasks-per-child=500", "-n", "worker@%h", "--without-heartbeat", "--without-gossip", "--without-mingle"]
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Healthcheck: lightweight process check instead of heavy app-loading `celery inspect ping`
    # pgrep checks the worker process exists without loading Django (critical for 1GB RAM VPS)
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 128m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Celery Beat Scheduler (separate dari worker untuk cegah OOM) ----
  # Beat scheduler berdiri sendiri, memory footprint minimal (~20MB).
  # Tidak perlu healthcheck complex — `pgrep -f 'celery.*beat'` sudah cukup.
  # Depend on redis only (not django) karena beat hanya jadwalkan task, tidak eksekusi.
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-celery-beat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "true"
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "celery.beat.PersistentScheduler"]
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Healthcheck: lightweight process check (beat scheduler minimal ~20MB RAM)
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 32m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


  # ---- Nginx (Reverse Proxy, Static/Media) ----
  nginx:
    image: nginx:1.25-alpine
    container_name: warungio-nginx
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    # ═══════════════════════════════════════════════════════════════
    # PRODUCTION CONFIG — Server name: warungio.web.id
    # ═══════════════════════════════════════════════════════════════
    # Base config uses warungio.conf (production SSL config).
    # Self-signed certs auto-generated by scripts/deploy.sh.
    #
    # LOCAL DEVELOPMENT: docker-compose.override.yml (auto-loaded)
    #   replaces warungio.conf → nginx.dev.conf (plain HTTP, no SSL)
    #   No -f flags needed: `docker compose up -d` loads override.
    #
    # PRODUCTION DEPLOYMENT: use explicit -f flags:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
    #   → Override file is NOT loaded when -f flags are used.
    # ═══════════════════════════════════════════════════════════════
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/warungio.conf:/etc/nginx/conf.d/warungio.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/django_backend/media:ro
      - ./assets:/app/assets:ro
      - ./auth:/app/auth:ro
      - ./buyer:/app/buyer:ro
      - ./seller:/app/seller:ro
      - ./home:/app/home:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    # NOTES:
    #   CHOWN  → Nginx master (root) perlu chown() temp directories (/var/cache/nginx/{client,proxy,fastcgi,uwsgi,scgi}_temp) ke user nginx (UID 101)
    #             saat startup. Tanpa CAP_CHOWN, semua direktori temp gagal di-chown → nginx crash dengan EPERM.
    #   NET_BIND_SERVICE → Bind ke port 80/443 (privileged ports < 1024)
    #   SETGID/SETUID   → Nginx master perlu drop privileges dari root ke user nginx untuk worker processes
    # Healthcheck: check nginx master process via PID (lighter than nginx -t every 15s)
    #   nginx -t validates full config + reads SSL certs every run → 240x/hour unnecessary I/O
    #   pgrep checks PID file existence → near-zero overhead
    # Note: CAP_KILL is NOT granted, so kill -0 $(cat /var/run/nginx.pid) won't work.
    #   pgrep reads /proc which is accessible even with cap_drop: ALL.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'nginx: master' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 48m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Prometheus (Lightweight Metrics Collection) ----
  # Scrapes node_exporter + cadvisor every 60s. ~50MB RAM idle.
  # OPTIONAL: Enable only after VPS has swap & is stable.
  # Start with: docker compose --profile monitoring up -d
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    container_name: warungio-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # NOTE: Prometheus v2.53 uses gcr.io/distroless/static base — NO shell, NO wget/curl.
    # Application-level healthcheck cannot be added without custom tooling.
    # Docker restart policy (unless-stopped) handles crashes.
    # If enabled alongside the monitoring stack, cadvisor scrapes container state.
    # In future, consider adding a sidecar or multi-stage healthcheck binary.
    mem_limit: 64m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Node Exporter (Host-Level Metrics) ----
  # CPU, memory, disk, network from the Docker host. ~20MB RAM.
  # OPTIONAL: Enable only after VPS has swap & is stable.
  node_exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.0
    container_name: warungio-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    pid: host
    # NOTE: node_exporter v1.8 uses gcr.io/distroless/static base — NO shell, NO wget/curl.
    # Application-level healthcheck cannot be added without custom tooling.
    # Docker restart policy (unless-stopped) handles crashes.
    # In future, consider adding a sidecar or multi-stage healthcheck binary.
    mem_limit: 32m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- cAdvisor (Container-Level Metrics) ----
  # Per-container CPU, memory, network, disk I/O. ~40MB RAM.
  # OPTIONAL: Enable only after VPS has swap & is stable.
  # NOTE: cAdvisor v0.49 uses distroless base image — no shell, no wget/curl.
  #   Healthcheck cannot be added without custom tooling. Docker restart policy
  #   (unless-stopped) handles crashes. Prometheus scrapes /metrics every 60s
  #   and will detect missing data if cAdvisor is down.
  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: warungio-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    mem_limit: 48m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mysql_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  prometheus_data:
    driver: local

networks:
  warungio_net:
    driver: bridge
