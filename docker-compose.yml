# =============================================================================
# Warungio Marketplace — Docker Compose
# AGGRESSIVELY OPTIMIZED for 1 vCPU / 1 GB RAM Hard Limit
# Total allocated: 736 MB → leaves 264 MB for OS + burst
# =============================================================================

services:
  # ---- MariaDB Database (Optimized: 64M buffer pool, 20 connections, 160m limit) ----
  mysql:
    image: mariadb:10.11
    container_name: warungio-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/warungio_full_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MariaDB low-memory config: innodb_buffer_pool_size=64M, max_connections=20
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 170m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Redis (Channels, Cache, Celery Broker) — Optimized for 1GB VPS ----
  # maxmemory 64mb — cukup untuk 4 roles (broker, cache, sessions, channel
  # layer) pada single-tenant VPS. allkeys-lru eviction tetap jalan jika
  # melebihi limit. 80m container limit + 25% headroom.
  # NOTE: Jika traffic tinggi dengan >50 concurrent users, naikkan ke 80mb.
  #       LRU eviction pada 64mb bisa logout session aktif jika terlalu penuh.
  redis:
    image: redis:7-alpine
    container_name: warungio-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 80m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Django Backend (Gunicorn+Uvicorn — 1 Worker, 2 Threads, 160m) ----
  # 1 worker × 2 threads uses ~80-120 MB RSS. 160m gives 33% headroom.
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-django
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "8000"
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "false"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/django_backend/media
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --connect-timeout 5 http://localhost:8000/health/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    mem_limit: 160m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Celery Worker (Async Tasks) — 1 concurrency, 96m limit ----
  # 1 concurrency + 200 max-tasks-per-child dari settings.py. 
  # Pada 1GB VPS, 96m cukup untuk Django app stack (~50-60 MB) 
  # + task processing overhead (~20-30 MB). max-tasks-per-child=200
  # mencegah memory leak tanpa restart container.
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-celery
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "true"
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "1", "--max-tasks-per-child=200", "-n", "worker@%h", "--without-heartbeat", "--without-gossip", "--without-mingle"]
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis exists celery:heartbeat:worker 2>/dev/null | grep -q 1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 112m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Celery Beat Scheduler (separate worker, 64m — empirically tested) ----
  # 🔴 Berdasarkan pengalaman: 32m dan 48m terbukti OOM karena Django
  # full stack (~30-40 MB) + scheduler (~5 MB) + GC overhead.
  # 64m adalah sweet spot — jangan turunkan lagi!
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-celery-beat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_ENABLED: "true"
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "celery.beat.PersistentScheduler", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis exists celery:heartbeat:beat 2>/dev/null | grep -q 1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 64m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


  # ---- Nginx (Reverse Proxy, Static/Media) — 48m tetap (already minimal) ----
  nginx:
    image: nginx:1.25-alpine
    container_name: warungio-nginx
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/warungio.conf:/etc/nginx/conf.d/warungio.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/django_backend/media:ro
      - ./assets:/app/assets:ro
      - ./auth:/app/auth:ro
      - ./buyer:/app/buyer:ro
      - ./seller:/app/seller:ro
      - ./home:/app/home:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'nginx: master' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 48m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Flower (Celery Task Monitoring Dashboard) ----
  # Real-time Celery worker monitoring: task progress, queue depth, retries, failures.
  # Only listens on internal Docker network (not exposed to public).
  # Access via SSH tunnel: ssh -L 5555:localhost:5555 root@36.50.77.237
  # Then open http://localhost:5555 in browser.
  # OPTIONAL: Enable with monitoring profile.
  flower:
    profiles: ["monitoring"]
    image: mher/flower:2.0
    container_name: warungio-flower
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: "5555"
      FLOWER_BASIC_AUTH: "${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-warungio123}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5555 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 48m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Prometheus (Lightweight Metrics Collection) ----
  # Scrapes node_exporter + cadvisor every 60s. ~50MB RAM idle.
  # OPTIONAL: Enable only after VPS has swap & is stable.
  # Start with: docker compose --profile monitoring up -d
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    container_name: warungio-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # NOTE: Prometheus v2.53 uses gcr.io/distroless/static base — NO shell, NO wget/curl.
    # Application-level healthcheck cannot be added without custom tooling.
    # Docker restart policy (unless-stopped) handles crashes.
    # If enabled alongside the monitoring stack, cadvisor scrapes container state.
    # In future, consider adding a sidecar or multi-stage healthcheck binary.
    mem_limit: 64m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- Node Exporter (Host-Level Metrics) ----
  # CPU, memory, disk, network from the Docker host. ~20MB RAM.
  # OPTIONAL: Enable only after VPS has swap & is stable.
  node_exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.0
    container_name: warungio-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    pid: host
    # NOTE: node_exporter v1.8 uses gcr.io/distroless/static base — NO shell, NO wget/curl.
    # Application-level healthcheck cannot be added without custom tooling.
    # Docker restart policy (unless-stopped) handles crashes.
    # In future, consider adding a sidecar or multi-stage healthcheck binary.
    mem_limit: 32m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---- cAdvisor (Container-Level Metrics) ----
  # Per-container CPU, memory, network, disk I/O. ~40MB RAM.
  # OPTIONAL: Enable only after VPS has swap & is stable.
  # NOTE: cAdvisor v0.49 uses distroless base image — no shell, no wget/curl.
  #   Healthcheck cannot be added without custom tooling. Docker restart policy
  #   (unless-stopped) handles crashes. Prometheus scrapes /metrics every 60s
  #   and will detect missing data if cAdvisor is down.
  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: warungio-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    mem_limit: 48m
    networks:
      - warungio_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mysql_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  prometheus_data:
    driver: local

networks:
  warungio_net:
    driver: bridge
