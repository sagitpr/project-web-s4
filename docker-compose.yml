# =============================================================================
# Warungio Marketplace — Docker Compose
# Services: Django (Daphne), MySQL, Redis, Nginx
# =============================================================================

version: "3.9"

services:
  # ---- MySQL Database ----
  mysql:
    image: mariadb:10.11
    container_name: warungio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-warungio_db}
      MYSQL_USER: ${DB_USER:-warungio}
      MYSQL_PASSWORD: ${DB_PASS:-warungio_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/warungio_full_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Channels, Cache, Celery) ----
  redis:
    image: redis:7-alpine
    container_name: warungio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Django Backend (Daphne ASGI) ----
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungio-django
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8000"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      USE_MYSQL: "true"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${DB_NAME:-warungio_db}
      DB_USER: ${DB_USER:-warungio}
      DB_PASS: ${DB_PASS:-warungio_secret}
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000}
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_SSL_REDIRECT: "false"
      SECURE_HSTS_SECONDS: "0"
      BINDERBYTE_API_KEY: ${BINDERBYTE_API_KEY:-}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/django_backend/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "

  # ---- Nginx (Reverse Proxy, Static/Media) ----
  nginx:
    image: nginx:1.25-alpine
    container_name: warungio-nginx
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/warungio.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/django_backend/media:ro
      - ./assets:/app/assets:ro
    # For production with SSL, replace nginx.dev.conf with:
    #   - ./nginx/warungio.conf:/etc/nginx/conf.d/warungio.conf:ro
    #   and add SSL certificates volume mount

volumes:
  mysql_data:
  static_volume:
  media_volume:
