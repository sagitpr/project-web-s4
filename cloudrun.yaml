apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/build-enable-automatic-updates: 'false'
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/maxScale: '3'
    run.googleapis.com/urls: '["https://warungio-96622149770.asia-southeast2.run.app"]'
    serving.knative.dev/creator: admin@warungio.com
    serving.knative.dev/lastModifier: admin@warungio.com
  creationTimestamp: '2026-06-05T15:37:00.388148Z'
  generation: 10
  labels:
    cloud.googleapis.com/location: asia-southeast2
    run.googleapis.com/satisfiesPzs: 'true'
  name: warungio
  namespace: '96622149770'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      containers:
      - env:
        - name: DJANGO_SETTINGS_MODULE
          value: config.settings
        - name: DJANGO_DEBUG
          value: "False"
        - name: DJANGO_ALLOWED_HOSTS
          value: "localhost,127.0.0.1,.run.app"
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: DJANGO_SECRET_KEY
              key: latest
        - name: USE_MYSQL
          value: "true"
        - name: DB_HOST_TYPE
          value: "cloud_sql"
        - name: CLOUD_SQL_INSTANCE
          value: "your-project:asia-southeast2:your-instance"
        - name: DB_NAME
          value: "warungio_db"
        - name: DB_USER
          value: "warungio"
        - name: DB_ENGINE
          value: "django.db.backends.mysql"
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: DB_PASS
              key: latest
        - name: EMAIL_HOST
          value: "smtp.gmail.com"
        - name: EMAIL_PORT
          value: "587"
        - name: DEFAULT_FROM_EMAIL
          value: "noreply@warungio.com"
        - name: EMAIL_HOST_USER
          value: "your-email@gmail.com"
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: EMAIL_HOST_PASSWORD
              key: latest
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: REDIS_URL
              key: latest
        - name: SECURE_SSL_REDIRECT
          value: "true"
        - name: SESSION_COOKIE_SECURE
          value: "true"
        - name: CSRF_COOKIE_SECURE
          value: "true"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://your-project.asia-southeast2.run.app,https://yourdomain.com"
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: GOOGLE_MAPS_API_KEY
              key: latest
        - name: OTP_EXPIRE_MINUTES
          value: "5"
        - name: GOOGLE_CLIENT_ID
          value: "your-google-client-id.apps.googleusercontent.com"
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: GOOGLE_CLIENT_SECRET
              key: latest
        image: asia-southeast2-docker.pkg.dev/your-project/warungio/warungio:latest
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: cloud-sql-proxy
          mountPath: /cloudsql
        startupProbe:
          failureThreshold: 3
          periodSeconds: 30
          httpGet:
            path: /health/
            port: 8080
          timeoutSeconds: 5
      volumes:
      - name: cloud-sql-proxy
        csi:
          driver: cloudsql.cloud.google.com
          volumeAttributes:
            instances: "your-project:asia-southeast2:your-instance"
