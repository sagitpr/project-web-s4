<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memproses Login Apple - Warungio</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #f3faf5;
      color: #070b1d;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #d7dde8;
      border-top-color: #108d35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    p {
      margin-top: 24px;
      font-weight: 600;
      font-size: 1.1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64x64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180x180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192x192.png" />
</head>
<body>
  <div class="spinner"></div>
  <p>Memproses login Apple...</p>

  <script src="../../src/utils/auth.js"></script>
  <script src="../../src/services/api.js"></script>
  <script>
    (async function() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));

        const idToken = urlParams.get('id_token') || hashParams.get('id_token');
        const authCode = urlParams.get('authorization_code') || hashParams.get('authorization_code');

        if (idToken) {
          const data = await window.WarungioAPI.socialLogin('apple', {
            identity_token: idToken,
            authorization_code: authCode,
          });

          window.WarungioAuth.login(data.access, data.refresh, data.user);
          // Use centralized role-based redirect to canonical Django URLs
          if (window.WarungioAuth && typeof window.WarungioAuth.getRoleDashboardUrl === 'function') {
            window.location.href = window.WarungioAuth.getRoleDashboardUrl(data.user.role);
          } else {
            // Fallback: manual role check with absolute Django paths
            const role = data.user.role;
            if (role === 'seller') window.location.href = '/seller/dashboard/';
            else if (role === 'buyer') window.location.href = '/buyer/home/';
            else window.location.href = '/';
          }
        } else {
          window.location.href = '/auth/login/?error=apple_auth_failed';
        }
      } catch (err) {
        window.location.href = '/auth/login/?error=' + encodeURIComponent(err.message);
      }
    })();
  </script>
</body>
</html>
