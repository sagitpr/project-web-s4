# =============================================================================
# Warungio Marketplace — Docker Compose PRODUCTION Override
# ═══════════════════════════════════════════════════════════════════════════════
# Base docker-compose.yml ALREADY uses warungio.conf (production SSL config).
# This override adds:
#   - Let's Encrypt certificates volume (auto-renewal support)
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   → docker-compose.override.yml is NOT auto-loaded when -f flags are used.
#
# SELF-SIGNED CERTS: scripts/deploy.sh generates them automatically at
#   ./nginx/ssl/warungio.crt (mounted by base docker-compose.yml).
#
# LET'S ENCRYPT: After running scripts/setup-ssl.sh, LE certs at
#   /etc/letsencrypt/live/warungio.web.id/ are mounted into the container.
#   The nginx startup script auto-detects LE certs and configures them.
# =============================================================================

services:
  nginx:
    # Docker Compose v2 REPLACES list values (volumes, ports) when merging.
    # CRITICAL: Include ALL base volumes from docker-compose.yml here.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/warungio.conf:/etc/nginx/conf.d/warungio.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./assets:/app/assets:ro
      - ./auth:/app/auth:ro
      - ./buyer:/app/buyer:ro
      - ./seller:/app/seller:ro
      - ./home:/app/home:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/django_backend/media:ro
